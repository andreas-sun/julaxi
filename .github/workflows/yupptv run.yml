name: Auto Update YuppTV Fast

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  update-yupptv:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install urllib3 requests

      - name: Extract Encrypted Script
        env:
          ZIP_PASS: ${{ secrets.ZIP_PASS }}
        run: |
          7z x -p"${ZIP_PASS}" -y yupptv.zip

      - name: Run YuppTV Script
        run: python yupptv.py

      - name: Push Updates to Target Repo
        env:
          TARGET_TOKEN: ${{ secrets.TARGET_REPO_TOKEN }}
          TARGET_USER: "kora-moss"
          TARGET_REPO: "uni-api"
          TARGET_BRANCH: "main"
        run: |
          git config --global user.name "AutoUpdater Bot"
          git config --global user.email "bot@users.noreply.github.com"

          git clone --depth 1 https://${TARGET_USER}:${TARGET_TOKEN}@github.com/${TARGET_USER}/${TARGET_REPO}.git target_repo

          mkdir -p target_repo/yuptv
          cp -f yupptvfast.m3u target_repo/yuptv/

          cd target_repo
          git add yuptv/yupptvfast.m3u

          if git diff --staged --quiet; then
            echo "No changes detected. Nothing to push."
          else
            git commit -m "Auto-update YuppTV Fast playlist"
            git push origin ${TARGET_BRANCH}
            echo "Successfully updated YuppTV Fast!"
          fi
