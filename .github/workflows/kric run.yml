name: Auto Update KRIC

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  update-kric:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install requests urllib3

      - name: Run KRIC Script
        run: python kric.py

      - name: Create Password Protected ZIP
        env:
          ZIP_PASS: ${{ secrets.ZIP_PASS }}
        run: |
          7z a -tzip -p"${ZIP_PASS}" -mem=AES256 kric.zip ./crich

      - name: Push Updates to Target Repo
        env:
          TARGET_TOKEN: ${{ secrets.TARGET_REPO_TOKEN }}
          TARGET_USER: "kora-moss"
          TARGET_REPO: "uni-api"
          TARGET_BRANCH: "main"
        run: |
          git config --global user.name "AutoUpdater Bot"
          git config --global user.email "bot@users.noreply.github.com"

          git clone --depth 1 https://${TARGET_USER}:${TARGET_TOKEN}@github.com/${TARGET_USER}/${TARGET_REPO}.git target_repo

          mkdir -p target_repo/crich
          cp -rf crich/. target_repo/crich/
          cp -f kric.zip target_repo/

          cd target_repo
          git add crich/ kric.zip

          if git diff --staged --quiet; then
            echo "No changes detected. Nothing to push."
          else
            git commit -m "Auto-update KRIC data and encrypted zip"
            git push origin ${TARGET_BRANCH}
            echo "Successfully updated KRIC!"
          fi
